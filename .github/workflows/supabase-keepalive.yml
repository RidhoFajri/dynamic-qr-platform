name: Supabase Keepalive

on:
  schedule:
    # Berjalan setiap hari Senin, Rabu, dan Jumat pada jam 00:00 UTC
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch: # Memungkinkan eksekusi secara manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          echo "Melakukan ping ke Supabase untuk mencegah server terpause..."
          # Ping langsung ke endpoint Supabase menggunakan curl
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            "https://fdltgtzeljshxuocklfa.supabase.co/rest/v1/"
